[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fedgt"
version = "0.1.0"
description = "Audit the Noise: verifiable local DP for federated LoRA fine-tuning"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[tool.setuptools]
packages = ["fedgt"]
